<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#43606b"/></marker><style>text{font-family:Arial,sans-serif;fill:#18313b}.box{fill:#fff;stroke:#78919a;stroke-width:2;rx:14}.head{font-size:20px;font-weight:bold}.sub{font-size:15px}.line{stroke:#43606b;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}</style></defs>
<rect width="1500" height="900" fill="#f4f7f8"/><text x="60" y="60" font-size="32" font-weight="bold">Verity · components, evidence flow and controls</text>
<rect class="box" x="50" y="130" width="210" height="110"/><text class="head" x="75" y="172">Next.js UI</text><text class="sub" x="75" y="205">New run · report · review</text><text class="sub" x="75" y="228">CLI is planned, absent here</text>
<rect class="box" x="340" y="130" width="190" height="110"/><text class="head" x="385" y="172">FastAPI</text><text class="sub" x="365" y="205">runs · sources · approve</text>
<rect class="box" x="610" y="110" width="280" height="150"/><text class="head" x="652" y="153">Run engine</text><text class="sub" x="635" y="184">fixed steps · time/credit/₹ ceilings</text><text class="sub" x="652" y="216">retry once · checkpoint each step</text>
<rect class="box" x="990" y="100" width="230" height="130"/><text class="head" x="1020" y="144">Data checks</text><text class="sub" x="1010" y="177">resolve · company · director</text><text class="sub" x="1018" y="204">activity · duplicate · look-alike</text>
<rect class="box" x="990" y="290" width="230" height="150"/><text class="head" x="1034" y="333">Web checks</text><text class="sub" x="1010" y="366">site · copied site · media</text><text class="sub" x="1010" y="393">timeline · explanation</text><text class="sub" x="1015" y="420">Planned LLM: extract/write only</text>
<rect class="box" x="1280" y="135" width="190" height="185"/><text class="head" x="1302" y="171">Crustdata API</text><text x="1290" y="193" font-size="10">POST /company/identify</text><text x="1290" y="209" font-size="10">POST /company/enrich</text><text x="1290" y="225" font-size="10">POST /person/enrich</text><text x="1290" y="241" font-size="10">POST /person/search</text><text x="1290" y="257" font-size="10">POST /company/search</text><text x="1290" y="273" font-size="10">POST /job/search</text><text x="1290" y="289" font-size="10">POST /web/search/live</text><text x="1290" y="305" font-size="10">GET /account/credits</text>
<rect class="box" x="610" y="340" width="280" height="135"/><text class="head" x="665" y="384">SQLite WAL</text><text class="sub" x="642" y="416">steps · sources · evidence</text><text class="sub" x="642" y="444">restart resumes checkpoints</text>
<rect class="box" x="340" y="340" width="190" height="135"/><text class="head" x="375" y="384">Source store</text><text class="sub" x="362" y="416">raw API records</text><text class="sub" x="362" y="444">URLs · passages · dates</text>
<rect class="box" x="340" y="560" width="190" height="135"/><text class="head" x="380" y="604">Cost ledger</text><text class="sub" x="358" y="636">provider · credits · ₹</text><text class="sub" x="358" y="664">tokens · latency · status</text>
<rect class="box" x="610" y="560" width="280" height="135"/><text class="head" x="668" y="604">Verdict rules</text><text class="sub" x="642" y="636">CLEARED / FRONT / HOLD</text><text class="sub" x="642" y="664">CANNOT VERIFY · sourced report</text>
<rect class="box" x="990" y="560" width="230" height="135"/><text class="head" x="1020" y="604">Human approval</text><text class="sub" x="1015" y="636">clear/reject + required reason</text><text class="sub" x="1020" y="664">unique run decision · once</text>
<rect class="box" x="1280" y="560" width="190" height="135"/><text class="head" x="1300" y="604">Output mapping</text><text class="sub" x="1300" y="636">Kickoff format · stub</text><text class="sub" x="1304" y="664">result + evidence</text>
<path class="line" d="M260 185H340"/><path class="line" d="M530 185H610"/><path class="line" d="M890 155H990"/><path class="line" d="M890 205H990"/><path class="line" d="M1220 165H1280"/><path class="line" d="M1220 345H1265V255H1280"/><path class="line" d="M1110 230V290"/><path class="line" d="M750 260V340"/><path class="line" d="M610 400H530"/><path class="line" d="M750 475V560"/><path class="line" d="M530 410H570V627H530"/><path class="line" d="M890 627H990"/><path class="line" d="M1220 627H1280"/><path class="line" d="M700 260V525H440V560"/>
<text class="sub" x="55" y="775">Planned retrying client: respect provider limits; 429 waits/retries · timeout/error → unknown + review · 402 → hold.</text><text class="sub" x="55" y="810">Planned provider/model calls → sources and cost ledger; LLM extracts/writes only; rule code decides verdict.</text><text class="sub" x="55" y="845">Implemented crash recovery: startup requeues interrupted runs and resumes SQLite checkpoints. UNIQUE(run_id) makes approval once.</text><text x="55" y="878" font-size="13" fill="#8a3b16">Checkout: API/engine implemented; B/C data/web layers are stubs and external provider calls are not live.</text>
</svg>
