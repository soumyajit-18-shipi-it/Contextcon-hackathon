# Verity configuration. Re-read at the START OF EVERY RUN (backend/config.py),
# so a rule, limit or output-field change needs no restart: edit, save, next run uses it.
# Live-fix cheat sheet: thresholds -> rules / verdict_rules, ceilings -> limits,
# new output field -> output_fields.

# Ceilings, checked before every step. Breaching one -> run status 'held'.
limits:
  time_limit_s: 300        # seconds of actual work (crash downtime not counted). Was 180: a live run with the
                           # news screen + two slow Crustdata retries hit 181 s (Delhivery, 2026-11-22).
  credit_limit: 300        # Crustdata credits per run
  cost_limit_inr: 25       # total rupees per run (Crustdata + LLM)
  web_calls_per_run: 8     # web search + fetch calls per run (Crustdata web limit is 10/min)
  media_web_calls: 2       # of those, kept for the news screen (copied-site may not use them)

# Thresholds used by the checks (B, C and Lead read these; no numbers in code).
rules:
  nominee_roles: 5             # director with >= this many current roles -> nominee pattern (hard)
  claimed_age_gap_years: 2     # site claims to be older than the record by more than this -> hard
  director_recent_days: 90     # director joined fewer than this many days ago -> soft
  namesake_match: 60           # media match score >= this -> same person
  namesake_clear: 25           # media match score <= this (+ a contradicting fact) -> namesake cleared
  lookalike_max_edit: 2        # edit distance at or below this -> look-alike domain
  duplicate_name_match: 90     # name score >= this + same director -> likely duplicate (soft)
  lookalike_name_min: 85       # name score >= this, different director/domain -> look-alike name (soft)
  resolve_min_confidence: 0.9  # name-only lookup: matches at/above this are "plausible"; >1 plausible -> a person picks
  resolve_candidate_min_confidence: 0.7  # below this a name match is a fuzzy hit, not a candidate (none left -> CANNOT VERIFY)
  max_candidates: 5            # candidates shown to the person
  max_directors: 2             # Person Enrich at most this many people per run (credits)
  hiring_window_days: 180      # job postings in this window -> hiring activity
  flag_no_recent_hiring: soft  # severity when there are no postings in the window (soft | none)
  min_monthly_visitors: 100    # web traffic below this -> soft
  headcount_trend_months: 12   # headcount must have changed at least once in this many months
  media_results_per_query: 5   # search results per news query that are read
  media_sources: [news]        # adverse media = news only (forum posts / social complaints are not screened)

# Verdict rules (backend/engine/verdict.py). Plain code, no LLM.
verdict_rules:
  front_min_hard: 2            # SUSPECTED FRONT if hard flags >= this ...
  front_one_hard_min_soft: 2   # ... or 1 hard + soft flags >= this
  # Core facts: if every one of these is cant_verify (or missing) -> CANNOT VERIFY
  core_checks: [domain_matches_record, name_location_consistent, headcount_present, director_current_role]
  # Activity checks: at least one verified + unflagged -> the vendor is "active"
  activity_checks: [headcount_present, headcount_trend, hiring_activity, web_traffic]
  # A key check that comes back 'unknown' (source timed out/errored) -> HOLD FOR REVIEW
  unknown_key_checks: [domain_matches_record, director_current_role, adverse_media]
  # Flags that send a run to HOLD but never count towards SUSPECTED FRONT (a known vendor is not a fraud)
  review_only_checks: [duplicate_exact, duplicate_likely, duplicate_past_run]
  # Checks that must be VERIFIED before a vendor can be CLEARED; otherwise HOLD FOR REVIEW.
  required_for_clear: [adverse_media]

# Crustdata pricing, for the ledger's rupee column (B's ledger.py reads this).
pricing:
  # PLACEHOLDER, NOT A SOURCED NUMBER. Crustdata publishes no public price per credit.
  # Get the real figure from the ContextCon dashboard credits page or the Crustdata team,
  # and until then the README must say any rupee cost is an assumption.
  inr_per_credit: 0.0
  inr_per_credit_is_placeholder: true
  # PLACEHOLDER exchange rate for converting the LLM's USD price to rupees. Replace with a sourced
  # reference rate (e.g. RBI) and say so in the README.
  usd_to_inr: 85.0
  usd_to_inr_is_placeholder: true

# LLM used only to extract facts and write the explanation (never to decide). Prices: Anthropic list
# price for Claude Haiku 5.5, USD per million tokens, for prompts up to 100K tokens (ours are far smaller;
# above 100K the price is $0.50 in / $2.50 out). Checked against the page below on 2026-11-22.
llm:
  provider: anthropic
  model: claude-haiku-5-5
  usd_per_mtok_in: 0.10
  usd_per_mtok_out: 0.50
  price_source: https://platform.claude.com/docs/en/about-claude/pricing
  max_output_tokens: 2000

# ---- Kickoff formats: the ONLY place to remap when docs/kickoff/ arrives (all TEMPORARY now) ----

# Batch files for backend/cli.py
batch_format:
  cases_key: cases          # input file is {"cases": [...]} (a bare list also works)
  case_id_field: id         # each case's id; copied into its result
  results_key: results      # output file is {"results": [...]}

# Input: our field -> field name in the kickoff input
input_fields:
  name: vendor_name
  website: website
  director: director
  claimed_year: claimed_year
  request_text: request

# Output: kickoff output field -> where we take it from (dotted path into input/verdict/answers/run).
output_fields:
  vendor_name: input.name
  website: input.website
  verdict: verdict.verdict
  rule: verdict.rule
  reasons: verdict.reasons
  who_runs_it: fn:who_runs_it
  how_long_it_has_existed: fn:how_long_it_has_existed
  is_it_trading: fn:is_it_trading
  what_looks_off: fn:what_looks_off
  cannot_verify: fn:cannot_verify_text
  sources: fn:sources_text
  status: run.status
  status_text: fn:status_text
  status_reason: run.status_reason
  run_id: run.id

# ---- Clients: one block per client_id. A run uses its client's block (default: "default"). ----
# A client may override any keys of: limits, rules, verdict_rules, batch_format, input_fields, output_fields.
# Only the keys it sets change; everything else comes from the sections above.
clients:
  default:                                    # the kickoff client (details from the kit)
    name: TBD
    records_path: data/client_records.json    # .json (list, or {"vendors": [...]}) or .csv; reloaded when it changes
    # Our field -> column/key name in this client's records file. TEMPORARY until the kickoff kit.
    record_fields: {name: name, domain: website, director: director, gstin: gstin}
  demo_3pl:                                   # DEMO client used for the live test batch (tests/cases.live.json)
    name: Demo 3PL (stand-in until the kickoff kit's client records arrive)
    records_path: tests/client_records.demo.json
    record_fields: {name: name, domain: website, director: director, gstin: gstin}
  # A second client is one more block, for example:
  # example_bank:
  #   name: Example Bank
  #   records_path: data/example_bank_vendors.csv
  #   record_fields: {name: vendor, domain: url, director: md, gstin: gstin}
  #   limits: {credit_limit: 150}
  #   verdict_rules: {required_for_clear: [adverse_media, copied_site]}
